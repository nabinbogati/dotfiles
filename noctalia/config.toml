[backdrop]
enabled = true

[bar.default]
background_opacity = 0.74999998323619366
capsule = true
concave_edge_corners = false
contact_shadow = true
margin_ends = 0
padding = 0
panel_overlap = 0
radius = 0

    [bar.default.monitor.DP-1]
    enabled = false

[brightness]
enable_ddcutil = true
sync_all_monitors = true

[desktop_widgets]
enabled = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [
    "lockscreen-login-box@winit",
    "lockscreen-login-box@DP-4",
    "lockscreen-login-box@HDMI-A-2",
    "lockscreen-login-box@DP-1",
    "lockscreen-login-box@HDMI-A-1"

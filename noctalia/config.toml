[osd]
background_opacity = 0.99999997764825821
position = "top_right"
position_vertical = "top_right"

[shell]
font_family = "JetBrainsMono Nerd Font"
panel_anchor_bar = "default"
screen_time_enabled = true

    [shell.panel]
    control_center_position = "center"
    floating_layer = "top"
    launcher_placement = "attached"
    open_near_click_control_center = true
    polkit_placement = "attached"
    polkit_position = "auto"

    [shell.screen_corners]
    size = 1

[theme]
builtin = "Catppuccin"
mode = "auto"
shell_mode = "dark"
source = "builtin"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "ghostty", "kcolorscheme", "qt" ]

[wallpaper.default]
path = "/home/nabin/Pictures/Wallpapers/minimal.jpg"

[wallpaper.last]
path = "/home/nabin/Pictures/Wallpapers/minimal.jpg"

[wallpaper.monitors.DP-1]
path = "/home/nabin/Pictures/Wallpapers/minimal.jpg"

[wallpaper.monitors.HDMI-A-1]
path = "/home/nabin/Pictures/Wallpapers/minimal.jpg"


[control_center]
width=1000
sidebar="compact"
